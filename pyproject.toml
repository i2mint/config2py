[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "config2py"
version = "0.1.50"
description = "Simplified reading and writing configurations from various sources and formats"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = []
dependencies = ["dol", "i2", "importlib_resources; python_version < '3.9'"]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/i2mint/config2py"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]
# Codec extras - optional dependencies for various config formats
yaml = ["pyyaml>=6.0"]
toml = ["tomli>=2.0.0; python_version < '3.11'", "tomli-w>=1.0.0"]
env = ["python-dotenv>=1.0.0"]
json5 = ["json5>=0.9.0"]
properties = ["jproperties>=2.1.0"]
# Convenience groups
all-codecs = [
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "python-dotenv>=1.0.0",
    "json5>=0.9.0",
    "jproperties>=2.1.0",
]
all = [
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "python-dotenv>=1.0.0",
    "json5>=0.9.0",
    "jproperties>=2.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
# The package dir, not "tests": there is no top-level tests/ directory (tests live
# in config2py/tests/). Naming a non-existent path made pytest emit
# PytestConfigWarning and silently fall back to recursive discovery from the CWD.
testpaths = ["config2py"]
# Kept in sync with what the wads run-tests-uv CI action passes on the command
# line (-o doctest_optionflags='ELLIPSIS IGNORE_EXCEPTION_DETAIL'), which
# overrides this setting. Diverging here means doctests that pass locally can
# fail in CI (and vice versa) -- notably NORMALIZE_WHITESPACE, which CI does not set.
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL"]
